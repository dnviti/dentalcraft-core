[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-alpha.10"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/dnviti/dentalcraft-core"
authors = ["Daniele Viti"]
publish = false

[workspace.dependencies]
# internal crates
dc-mesh = { path = "crates/dc-mesh" }
dc-geom = { path = "crates/dc-geom" }
dc-case = { path = "crates/dc-case" }
dc-command = { path = "crates/dc-command" }
dc-jobs = { path = "crates/dc-jobs" }
dc-scene = { path = "crates/dc-scene" }
dc-project = { path = "crates/dc-project" }
dc-module-api = { path = "crates/dc-module-api" }
dc-i18n = { path = "crates/dc-i18n" }
dc-theme = { path = "crates/dc-theme" }
dc-session = { path = "crates/dc-session" }
dc-mcp = { path = "crates/dc-mcp" }
dc-raster = { path = "crates/dc-raster" }
dc-scanner = { path = "crates/dc-scanner" }
dc-ble = { path = "crates/dc-ble" }
dc-turntable = { path = "crates/dc-turntable" }
dc-print = { path = "crates/dc-print" }

# GUI: egui, eframe and egui-wgpu must always share the same version
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }

# math, hashing, serialization
glam = { version = "0.34.1", features = ["serde"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }  # "pure": no C/asm build step
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"  # JSON Schema of command parameters (CLI / MCP)
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

# concurrency
rayon = "1.12.0"

# run-time loading of optional vendor SDKs (never linked)
libloading = "0.8.9"

# scanner USB video: device discovery (Linux, Windows), V4L2 ioctls on Linux (pure Rust, no libc/libusb)
nusb = "0.2.9"
rustix = { version = "1.1.6", features = ["fs", "mm", "event"] }

# Bluetooth LE (blocking, pure Rust): BlueZ over D-Bus on Linux, WinRT on Windows;
# `windows` also binds Media Foundation for the scanner capture on Windows (dc-scanner)
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
windows = "0.62.2"
windows-core = "0.62.2"  # COM objects implemented in Rust (`#[implement]` needs the crate by name)
# Bluetooth LE on macOS: CoreBluetooth through the objc2 bindings (pure Rust, generated)
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-bluetooth = "0.3.2"
dispatch2 = "0.3.1"

# geometry: linear algebra (SVD, eigen) and k-d tree nearest neighbours
nalgebra = "0.35.0"
kiddo = { version = "6.3.0", default-features = false, features = ["multi-threaded"] }

# headless rendering output
png = "0.18.1"

# i18n
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"

# project file container (deflate via pure-Rust zlib-rs; no zstd: it needs a C build)
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# testing
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo kani` (docs/kani.md): kiddo (dc-geom) depends on generator, whose
# global asm Kani cannot model; no proof harness reaches it. Stubbing lets
# harnesses replace `format!` on error paths they do not check.
[workspace.metadata.kani]
flags = { ignore-global-asm = true }
unstable = { unstable-options = true, stubbing = true }
