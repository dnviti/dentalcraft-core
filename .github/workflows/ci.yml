name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ARC scale set in golgari's k3s: one ephemeral pod per job, no GPU.
    # Every step after checkout is skipped until the workspace has a
    # Cargo.toml, so the first pushes of the empty scaffold are green.
    runs-on: golgari-dev
    steps:
      - uses: actions/checkout@v7
      - name: Install C toolchain
        run: |
          if ! command -v cc >/dev/null; then
            SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
            if command -v apt-get >/dev/null; then
              $SUDO apt-get update -qq && $SUDO apt-get install -y --no-install-recommends build-essential pkg-config
            elif command -v dnf >/dev/null; then
              $SUDO dnf install -y gcc make pkgconf-pkg-config
            elif command -v apk >/dev/null; then
              $SUDO apk add --no-cache build-base pkgconf
            else
              echo "no supported package manager to install a C compiler" >&2; exit 1
            fi
          fi

      - name: Install Rust 1.99.1
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache cargo
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - name: Format
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
