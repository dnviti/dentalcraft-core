[package]
name = "dc-scanner"
description = "3D scanner acquisition: device backends (simulated, hardware), live tracking and TSDF fusion, point-cloud and mesh editing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dc-geom.workspace = true
dc-mesh.workspace = true
dc-turntable.workspace = true
glam.workspace = true
rayon.workspace = true
nalgebra.workspace = true
libloading.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nusb.workspace = true
rustix.workspace = true

# Media Foundation capture (entry points loaded at run time), the device
# tree (cfgmgr32) and the kernel-streaming properties of the vendor
# extension unit
[target.'cfg(windows)'.dependencies]
nusb.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
] }
windows-core.workspace = true

# the USB video reader of `revopoint_usb::uvc_bulk` (IOKit through nusb, plus
# a few direct IOKit calls in `revopoint_usb::macos`)
[target.'cfg(target_os = "macos")'.dependencies]
nusb.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace lints, except `unsafe_code`: denied here instead of forbidden,
# so that only `revopoint_sdk` (run-time loaded vendor SDK, FFI) can allow it.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
